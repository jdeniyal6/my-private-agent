<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bhai Ka Private AI Coder</title>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Header Style */
        header {
            background-color: #161b22;
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid #30363d;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        header h1 {
            font-size: 1.4rem;
            color: #58a6ff;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        /* Chat Container */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.6;
            font-size: 0.95rem;
            word-wrap: break-word;
        }

        .user-message {
            background-color: #1f6feb;
            color: #ffffff;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .ai-message {
            background-color: #161b22;
            color: #c9d1d9;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            border: 1px solid #30363d;
            width: 100%;
        }

        /* Uploaded Image Preview inside Chat */
        .chat-image {
            max-width: 250px;
            max-height: 250px;
            border-radius: 8px;
            margin-top: 5px;
            display: block;
            border: 2px solid #30363d;
        }

        /* Code Block Styling */
        pre {
            background-color: #05070a;
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 10px 0;
            border: 1px solid #21262d;
        }

        code {
            font-family: 'Fira Code', monospace;
            font-size: 0.9rem;
            color: #ff7b72;
        }

        .ai-message pre code {
            color: #79c0ff;
        }

        /* Input Area Footer */
        .footer-container {
            background-color: #161b22;
            border-top: 1px solid #30363d;
            padding: 10px 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* Image Preview Bar above Text input */
        .image-preview-bar {
            display: none;
            align-items: center;
            gap: 10px;
            background-color: #0d1117;
            padding: 8px;
            border-radius: 6px;
            border: 1px dashed #30363d;
        }

        .image-preview-bar img {
            height: 50px;
            width: 50px;
            object-fit: cover;
            border-radius: 4px;
        }

        .image-preview-bar .remove-btn {
            color: #f85149;
            cursor: pointer;
            font-size: 1.1rem;
        }

        .input-area {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        /* Attachment Button */
        .attach-btn {
            background-color: #21262d;
            color: #8b949e;
            border: 1px solid #30363d;
            border-radius: 8px;
            width: 50px;
            height: 50px;
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s, border-color 0.2s;
        }

        .attach-btn:hover {
            color: #58a6ff;
            border-color: #58a6ff;
        }

        textarea {
            flex: 1;
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 12px;
            color: #c9d1d9;
            font-size: 0.95rem;
            resize: none;
            height: 50px;
            outline: none;
            transition: border-color 0.2s;
        }

        textarea:focus {
            border-color: #58a6ff;
        }

        .send-btn {
            background-color: #238636;
            color: white;
            border: none;
            border-radius: 8px;
            width: 50px;
            height: 50px;
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s;
        }

        .send-btn:hover {
            background-color: #2ea043;
        }

        button:disabled {
            background-color: #21262d;
            color: #8b949e;
            cursor: not-allowed;
        }

        /* Loading Dots Animation */
        .loading-dots span {
            animation: blink 1.4s infinite both;
            display: inline-block;
            font-size: 1.4rem;
            line-height: 1;
        }
        .loading-dots span:nth-child(2) { animation-delay: .2s; }
        .loading-dots span:nth-child(3) { animation-delay: .4s; }

        @keyframes blink {
            0% { opacity: .2; }
            20% { opacity: 1; }
            100% { opacity: .2; }
        }
    </style>
</head>
<body>

    <header>
        <h1><i class="fa-solid fa-user-secret"></i> Bhai Ka Private Coder AI</h1>
    </header>

    <div class="chat-container" id="chatContainer">
        <div class="message ai-message">
            Bhai, aapka private an-censored AI system ready hai! 🚀 <br>
            Aap niche bane <b>Camera icon 📷</b> par click karke error ka screenshot ya koi bhi photo bhi bhej sakte ho!
        </div>
    </div>

    <div class="footer-container">
        <div class="image-preview-bar" id="previewBar">
            <img id="imgPreview" src="" alt="Preview">
            <span style="flex: 1; font-size: 0.85rem; color: #8b949e;">Screenshot selected...</span>
            <i class="fa-solid fa-circle-xmark remove-btn" onclick="removeSelectedImage()"></i>
        </div>

        <div class="input-area">
            <input type="file" id="fileInput" accept="image/*" style="display: none;" onchange="handleImageSelect(this)">
            
            <button class="attach-btn" onclick="document.getElementById('fileInput').click()">
                <i class="fa-solid fa-camera"></i>
            </button>

            <textarea id="userInput" placeholder="Apna coding prompt likho..."></textarea>
            <button class="send-btn" id="sendBtn" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </div>

    <script>
        // 🚀 Vercel के हिसाब से बिल्कुल सीधा यूआरएल पाथ
        const BACKEND_URL = "/api/chat"; 
        let chatHistory = [];
        let base64ImageData = null;

        // हैंडल इमेज सिलेक्शन
        function handleImageSelect(input) {
            const file = input.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                base64ImageData = e.target.result; // Base64 string generated
                document.getElementById("imgPreview").src = base64ImageData;
                document.getElementById("previewBar").style.display = "flex";
            };
            reader.readAsDataURL(file);
        }

        // इमेज हटाने के लिए 
        function removeSelectedImage() {
            base64ImageData = null;
            document.getElementById("fileInput").value = "";
            document.getElementById("previewBar").style.display = "none";
        }

        async function sendMessage() {
            const inputField = document.getElementById("userInput");
            const sendBtn = document.getElementById("sendBtn");
            const chatContainer = document.getElementById("chatContainer");
            const promptText = inputField.value.trim();

            if (!promptText && !base64ImageData) return;

            // User Message UI Build
            let userContentHTML = `<div>${promptText || "Sent a screenshot"}</div>`;
            if (base64ImageData) {
                userContentHTML += `<img src="${base64ImageData}" class="chat-image">`;
            }
            appendCustomHTML(userContentHTML, "user-message");

            // Temporary variables for request
            const sendingPrompt = promptText;
            const sendingImage = base64ImageData;

            // Clean inputs immediately
            inputField.value = "";
            inputField.style.height = "50px";
            removeSelectedImage();
            
            // Disable inputs during load
            inputField.disabled = true;
            sendBtn.disabled = true;

            // Loading Show
            const loadingId = "loading_" + Date.now();
            const loadingDiv = document.createElement("div");
            loadingDiv.className = "message ai-message loading-dots";
            loadingDiv.id = loadingId;
            loadingDiv.innerHTML = 'Bhai soch raha hai <span>.</span><span>.</span><span>.</span>';
            chatContainer.appendChild(loadingDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // Update History (If image is present, we tell the backend text context)
            let fullPromptContext = sendingPrompt;
            if (sendingImage) {
                fullPromptContext += " [Note: User uploaded a screenshot tool visual check. Analyze and solve any issue found inside it.]";
            }
            chatHistory.push({"role": "user", "content": fullPromptContext});

            try {
                const response = await fetch(BACKEND_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ "messages": chatHistory })
                });

                const data = await response.json();
                document.getElementById(loadingId).remove();

                if (data.choices && data.choices[0].message) {
                    const aiReply = data.choices[0].message.content;
                    appendAIEngineMessage(aiReply, "ai-message");
                    chatHistory.push({"role": "assistant", "content": aiReply});
                } else {
                    appendCustomHTML("Error: AI backend se valid response nahi mila bhai.", "ai-message");
                }

            } catch (error) {
                document.getElementById(loadingId).remove();
                appendCustomHTML("Backend Server Error: Connect karne me dikkat hai. Check karein ki Vercel par successfully deploy hua ya nahi.", "ai-message");
                console.error(error);
            }

            inputField.disabled = false;
            sendBtn.disabled = false;
            inputField.focus();
        }

        function appendCustomHTML(htmlContent, className) {
            const chatContainer = document.getElementById("chatContainer");
            const messageDiv = document.createElement("div");
            messageDiv.className = `message ${className}`;
            messageDiv.innerHTML = htmlContent;
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function appendAIEngineMessage(text, className) {
            const chatContainer = document.getElementById("chatContainer");
            const messageDiv = document.createElement("div");
            messageDiv.className = `message ${className}`;

            // Code Blocks Formatting & Safety parsing
            let formattedText = text
                .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
                .replace(/&lt;pre&gt;&lt;code&gt;([\s\S]*?)&lt;\/code&gt;&lt;\/pre&gt;/g, '<pre><code>$1</code></pre>') // Fix deep loops
                .replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>') 
                .replace(/\n/g, "<br>");
            
            messageDiv.innerHTML = formattedText;
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // Auto-expand textarea
        document.getElementById("userInput").addEventListener("input", function() {
            this.style.height = "auto";
            this.style.height = (this.scrollHeight) + "px";
        });

        // Enter submits, Shift+Enter new line
        document.getElementById("userInput").addEventListener("keydown", function(e) {
            if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
    </script>
</body>
  </html>
